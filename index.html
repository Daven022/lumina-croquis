<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumina — Croquis LED</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0f;color:#fff;font-family:'Roboto',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;user-select:none;cursor:none}

#header{background:#0d0d18;border-bottom:1px solid #1e2a4a;padding:6px 16px;display:flex;align-items:center;gap:16px;flex-shrink:0;height:58px}
#logo-area{display:flex;align-items:center;gap:10px}
#logo-area img{height:42px;object-fit:contain}
#logo-area span{font-size:10px;color:#4a90ff;letter-spacing:3px;text-transform:uppercase;font-weight:500}

#tabs{display:flex;gap:4px;flex:1;justify-content:center;align-items:center}
.tab{background:#12121f;border:1px solid #1e2a4a;color:#6b7db3;padding:6px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;display:flex;align-items:center;gap:7px;transition:all .15s;white-space:nowrap}
.tab:hover{border-color:#4a90ff;color:#fff}
.tab.active{background:#1a2a50;border-color:#4a90ff;color:#4a90ff}
.tab .tab-num{background:#4a90ff;color:#fff;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.tab.active .tab-num{background:#fff;color:#4a90ff}
#add-option{background:transparent;border:1px dashed #2a3a6a;color:#4a90ff;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
#add-option:hover{border-color:#4a90ff;background:#1a2a50}

#pdf-btn{background:#1a2a50;border:1px solid #4a90ff;color:#4a90ff;padding:7px 18px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;white-space:nowrap}
#pdf-btn:hover{background:#2a3a70}

#toolbar{background:#0d0d18;border-bottom:1px solid #1e2a4a;padding:0 16px;display:flex;align-items:center;gap:6px;flex-shrink:0;height:50px}
.tool-btn{background:#12121f;border:1px solid #1e2a4a;color:#8899cc;padding:7px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;transition:all .15s;white-space:nowrap;min-height:36px}
.tool-btn:hover{border-color:#4a90ff;color:#fff}
.tool-btn.active-pixel{background:#2a0f0f;border-color:#ff3030;color:#ff5050}
.tool-btn.active-strip{background:#0f1a2a;border-color:#4a90ff;color:#4a90ff}
.tool-btn.active-eraser{background:#1a1a2a;border-color:#8899cc;color:#fff}
.tool-btn.danger{border-color:#3a1a1a;color:#ff5050}
.tool-btn.danger:hover{border-color:#ff3030;background:#2a0f0f}

.sep{width:1px;height:26px;background:#1e2a4a;margin:0 2px}

.th-wrap{display:flex;align-items:center;gap:6px}
.th-label{font-size:11px;color:#4a5580;white-space:nowrap}
#th-slider{-webkit-appearance:none;width:70px;height:4px;border-radius:2px;background:#1e2a4a;outline:none;cursor:pointer}
#th-slider::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#4a90ff;cursor:pointer}
#th-val{font-size:11px;color:#4a90ff;min-width:16px;text-align:center}

#hint{font-size:11px;color:#3a4a70;margin-left:auto;white-space:nowrap}
kbd{background:#1e2a4a;padding:2px 6px;border-radius:4px;font-family:inherit;font-size:11px}

#main{flex:1;position:relative;overflow:hidden}
canvas{display:block;position:absolute;top:0;left:0}

#drop-zone{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none;z-index:10}
#drop-zone.visible{display:flex;pointer-events:all}
.drop-icon{font-size:52px;opacity:.25}
.drop-text{font-size:14px;color:#3a4a70;text-align:center;line-height:1.7}
.drop-btn{background:#1a2a50;border:1px solid #4a90ff;color:#4a90ff;padding:9px 22px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;pointer-events:all}
.drop-btn:hover{background:#2a3a70}
#file-input{display:none}

#option-menu{position:fixed;background:#12121f;border:1px solid #1e2a4a;border-radius:10px;overflow:hidden;z-index:1000;display:none;box-shadow:0 10px 28px rgba(0,0,0,.7);min-width:190px}
.opt-item{padding:10px 18px;cursor:pointer;font-size:13px;color:#8899cc;transition:all .1s;white-space:nowrap}
.opt-item:hover{background:#1a2a50;color:#fff}
.opt-item.danger{color:#ff5050}
.opt-item.danger:hover{background:#2a0f0f}

#custom-cursor{position:fixed;pointer-events:none;z-index:9999;transform:translate(-50%,-50%)}
#custom-cursor .dot{width:8px;height:8px;border-radius:50%;background:#fff}
#custom-cursor.mode-pixel .dot{background:#ff3030;box-shadow:0 0 8px #ff3030}
#custom-cursor.mode-strip .dot{background:#4a90ff;box-shadow:0 0 8px #4a90ff}
#custom-cursor.mode-eraser .dot{width:22px;height:22px;background:transparent;border:2px solid #8899cc;border-radius:50%}
</style>
</head>

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAf/9k=" alt="Lumina">
    <span>Croquis LED</span>
  </div>
  <div id="tabs">
    <div class="tab active" oncontextmenu="showOptMenu(event,0)">
      <span class="tab-num">1</span> Option 1
    </div>
    <button id="add-option" onclick="showAddMenu(event)">+ Option &#9661;</button>
  </div>
  <button id="pdf-btn" onclick="exportPDF()">&#11015; Télécharger PDF</button>
</div>

<div id="toolbar">
  <button class="tool-btn active-pixel" id="btn-pixel" onclick="setMode('pixel')">
    <svg width="16" height="8" viewBox="0 0 16 8"><line x1="0" y1="4" x2="16" y2="4" stroke="#ff5050" stroke-width="2.5" stroke-dasharray="3.5 3" stroke-linecap="round"/></svg>
    Pixel LED
  </button>
  <button class="tool-btn" id="btn-strip" onclick="setMode('strip')">
    <svg width="16" height="8" viewBox="0 0 16 8"><line x1="0" y1="4" x2="16" y2="4" stroke="#4a90ff" stroke-width="2.5" stroke-linecap="round"/></svg>
    Strip LED
  </button>
  <div class="sep"></div>
  <button class="tool-btn" id="btn-eraser" onclick="setMode('eraser')">&#10022; Gomme</button>
  <button class="tool-btn" onclick="undo()">&#8617; Retour</button>
  <div class="sep"></div>
  <div class="th-wrap">
    <span class="th-label">Largeur</span>
    <input type="range" id="th-slider" min="1" max="12" value="4" oninput="updateThickness(this.value)">
    <span id="th-val">4</span>
  </div>
  <div class="sep"></div>
  <button class="tool-btn danger" onclick="clearCanvas()">&#128465; Effacer tout</button>
  <button class="tool-btn danger" id="del-photo" onclick="deletePhoto()" style="display:none">&#128465; Photo</button>
  <div id="hint"><kbd>Espace</kbd> ou <kbd>Esc</kbd> &rarr; nouvelle ligne</div>
</div>

<div id="main">
  <canvas id="bg-canvas"></canvas>
  <canvas id="draw-canvas"
    onmousedown="onMouseDown(event)"
    onmousemove="onMouseMove(event)"
    onmouseup="onMouseUp(event)"
  ></canvas>
  <div id="drop-zone" class="visible">
    <div class="drop-icon">&#127968;</div>
    <div class="drop-text">Collez une capture d'écran (Ctrl+V)<br>ou choisissez une photo</div>
    <button class="drop-btn" onclick="document.getElementById('file-input').click()">&#128193; Choisir une photo</button>
  </div>
</div>

<input type="file" id="file-input" accept="image/*" onchange="loadFile(this)">

<div id="option-menu">
  <div class="opt-item" onclick="dupeWithLines()">Dupliquer avec lignes</div>
  <div class="opt-item" onclick="dupeWithoutLines()">Dupliquer sans lignes</div>
  <div class="opt-item" onclick="newImageOption()">Nouvelle image</div>
  <div class="opt-item danger" onclick="deleteOption()">Supprimer</div>
</div>

<script>

const { jsPDF } = window.jspdf;
const LOGO_SRC = document.getElementById('logo-img').src;

// Curseur
const cursor = document.getElementById('custom-cursor');
document.addEventListener('mousemove', e => { cursor.style.left=e.clientX+'px'; cursor.style.top=e.clientY+'px'; });
document.addEventListener('mouseleave', () => cursor.style.display='none');
document.addEventListener('mouseenter', () => cursor.style.display='');

// State
let options = [{ name:'Option 1', img:null, imgNative:null, strokes:[], imgOffX:0, imgOffY:0, imgW:0, imgH:0 }];
let curOpt=0, mode='pixel', drawing=false, startPt=null, spaceDown=false, lineStarted=false, menuTargetIdx=-1;
let strokeThickness=4;

const bgC=document.getElementById('bg-canvas');
const drC=document.getElementById('draw-canvas');
const bgCtx=bgC.getContext('2d');
const drCtx=drC.getContext('2d');
const main=document.getElementById('main');
const DPR = window.devicePixelRatio || 1;

function resize() {
  const w=main.clientWidth, h=main.clientHeight;
  bgC.style.width = drC.style.width = w+'px';
  bgC.style.height = drC.style.height = h+'px';
  bgC.width = drC.width = Math.round(w * DPR);
  bgC.height = drC.height = Math.round(h * DPR);
  bgCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  redraw();
}
window.addEventListener('resize', resize);
resize();

function renderTabs() {
  const tabs=document.getElementById('tabs');
  const addBtn=document.getElementById('add-option');
  [...tabs.querySelectorAll('.tab')].forEach(t=>t.remove());
  options.forEach((o,i) => {
    const t=document.createElement('div');
    t.className='tab'+(i===curOpt?' active':'');
    t.innerHTML='<span class="tab-num">'+(i+1)+'</span> '+o.name;
    t.onclick=()=>switchOption(i);
    t.oncontextmenu=e=>showOptMenu(e,i);
    tabs.insertBefore(t,addBtn);
  });
}

function switchOption(i) {
  curOpt=i; lineStarted=false; startPt=null;
  renderTabs(); redraw(); updateDropZone(); updateDelPhoto();
}

function addOption() {
  options.push({name:'Option '+(options.length+1),img:null,imgNative:null,strokes:[],imgOffX:0,imgOffY:0,imgW:0,imgH:0});
  switchOption(options.length-1);
}

function showOptMenu(e,idx) {
  e.preventDefault(); menuTargetIdx=idx;
  const m=document.getElementById('option-menu');
  m.style.display='block'; m.style.left=e.clientX+'px'; m.style.top=e.clientY+'px';
}
function showAddMenu(e) {
  e.stopPropagation();
  menuTargetIdx=curOpt;
  const m=document.getElementById('option-menu');
  const rect=e.target.getBoundingClientRect();
  m.style.display='block';
  m.style.left=rect.left+'px';
  m.style.top=(rect.bottom+4)+'px';
}
document.addEventListener('click',()=>document.getElementById('option-menu').style.display='none');

function dupeWithLines() {
  const s=options[menuTargetIdx];
  options.push({name:'Option '+(options.length+1),img:s.img,imgNative:s.imgNative,strokes:JSON.parse(JSON.stringify(s.strokes)),imgOffX:s.imgOffX,imgOffY:s.imgOffY,imgW:s.imgW,imgH:s.imgH});
  switchOption(options.length-1);
}
function dupeWithoutLines() {
  const s=options[menuTargetIdx];
  options.push({name:'Option '+(options.length+1),img:s.img,imgNative:s.imgNative,strokes:[],imgOffX:s.imgOffX,imgOffY:s.imgOffY,imgW:s.imgW,imgH:s.imgH});
  switchOption(options.length-1);
}
function newImageOption() {
  options.push({name:'Option '+(options.length+1),img:null,imgNative:null,strokes:[],imgOffX:0,imgOffY:0,imgW:0,imgH:0});
  switchOption(options.length-1);
}
function deleteOption() {
  if(options.length===1) return;
  options.splice(menuTargetIdx,1);
  if(curOpt>=options.length) curOpt=options.length-1;
  renderTabs(); redraw(); updateDropZone(); updateDelPhoto();
}

function loadImageSrc(src) {
  const img=new Image();
  img.onload=()=>{
    options[curOpt].img=img;
    options[curOpt].imgNative=src;
    fitImage(img);
    updateDropZone(); updateDelPhoto(); redraw();
  };
  img.src=src;
}

function fitImage(img) {
  const cw=main.clientWidth, ch=main.clientHeight;
  const scale=Math.min(cw/img.width, ch/img.height);
  options[curOpt].imgW=img.width*scale;
  options[curOpt].imgH=img.height*scale;
  options[curOpt].imgOffX=(cw-options[curOpt].imgW)/2;
  options[curOpt].imgOffY=(ch-options[curOpt].imgH)/2;
}

function loadFile(input) {
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>loadImageSrc(e.target.result);
  r.readAsDataURL(f); input.value='';
}

function deletePhoto() {
  options[curOpt].img=null; options[curOpt].imgNative=null; options[curOpt].strokes=[];
  lineStarted=false; startPt=null;
  updateDropZone(); updateDelPhoto(); redraw();
}

document.addEventListener('paste', e=>{
  for(let item of e.clipboardData.items) {
    if(item.type.startsWith('image/')) {
      const r=new FileReader();
      r.onload=ev=>loadImageSrc(ev.target.result);
      r.readAsDataURL(item.getAsFile()); break;
    }
  }
});

function updateDropZone() { document.getElementById('drop-zone').classList.toggle('visible',!options[curOpt].img); }
function updateDelPhoto() { document.getElementById('del-photo').style.display=options[curOpt].img?'':'none'; }

function setMode(m) {
  mode=m;
  document.getElementById('btn-pixel').className='tool-btn'+(m==='pixel'?' active-pixel':'');
  document.getElementById('btn-strip').className='tool-btn'+(m==='strip'?' active-strip':'');
  document.getElementById('btn-eraser').className='tool-btn'+(m==='eraser'?' active-eraser':'');
  cursor.className='mode-'+m;
  lineStarted=false; startPt=null; redrawPreview();
}

function updateThickness(val) {
  strokeThickness = parseInt(val);
  document.getElementById('th-val').textContent = val;
}

function undo() {
  if(options[curOpt].strokes.length>0) {
    options[curOpt].strokes.pop(); lineStarted=false; startPt=null; redraw();
  }
}
function clearCanvas() { options[curOpt].strokes=[]; lineStarted=false; startPt=null; redraw(); }

function getPos(e) {
  const rect=drC.getBoundingClientRect();
  return { x:e.clientX-rect.left, y:e.clientY-rect.top };
}

// Espace = annuler ligne en cours (changer de place) | Esc = annuler ligne en cours aussi
document.addEventListener('keydown', e=>{
  if(e.code==='Space' || e.key==='Escape') {
    e.preventDefault();
    if(lineStarted){ lineStarted=false; startPt=null; redrawPreview(); }
  }
});

function onMouseDown(e) {
  if(!options[curOpt].img) return;
  const pos=getPos(e);
  if(mode==='eraser'){drawing=true;eraseAt(pos);return;}
  if(!lineStarted){startPt=pos;lineStarted=true;}
  else{
    options[curOpt].strokes.push({x1:startPt.x,y1:startPt.y,x2:pos.x,y2:pos.y,mode,th:strokeThickness});
    startPt=pos; redraw();
  }
}
function onMouseMove(e) {
  if(!options[curOpt].img) return;
  const pos=getPos(e);
  if(mode==='eraser'&&drawing){eraseAt(pos);return;}
  if(lineStarted&&startPt) redrawPreview(pos);
}
function onMouseUp(){drawing=false;}

function eraseAt(pos) {
  const R=14;
  options[curOpt].strokes=options[curOpt].strokes.filter(s=>{
    const dx=s.x2-s.x1,dy=s.y2-s.y1,len=Math.sqrt(dx*dx+dy*dy)||1;
    const t=Math.max(0,Math.min(1,((pos.x-s.x1)*dx+(pos.y-s.y1)*dy)/(len*len)));
    return Math.sqrt((pos.x-(s.x1+t*dx))**2+(pos.y-(s.y1+t*dy))**2)>R;
  });
  redraw();
}

function applyStrokeStyle(ctx,s,alpha){
  ctx.globalAlpha=alpha??1;
  ctx.strokeStyle=s.mode==='pixel'?'#ff3030':'#4a90ff';
  ctx.lineWidth=s.th||strokeThickness; ctx.lineCap='round';
  ctx.shadowColor=s.mode==='pixel'?'#ff303099':'#4a90ff99'; ctx.shadowBlur=8;
  if(s.mode==='pixel') ctx.setLineDash([6,5]); else ctx.setLineDash([]);
}

function drawStroke(ctx,s,alpha){
  ctx.beginPath(); applyStrokeStyle(ctx,s,alpha);
  ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); ctx.stroke();
  ctx.setLineDash([]); ctx.shadowBlur=0; ctx.globalAlpha=1;
}

function redraw(){
  const opt=options[curOpt];
  const cw=main.clientWidth, ch=main.clientHeight;
  bgCtx.clearRect(0,0,cw,ch); drCtx.clearRect(0,0,cw,ch);
  if(opt.img) bgCtx.drawImage(opt.img,opt.imgOffX,opt.imgOffY,opt.imgW,opt.imgH);
  opt.strokes.forEach(s=>drawStroke(drCtx,s));
}

function redrawPreview(mousePos){
  const opt=options[curOpt];
  const cw=main.clientWidth, ch=main.clientHeight;
  drCtx.clearRect(0,0,cw,ch);
  opt.strokes.forEach(s=>drawStroke(drCtx,s));
  if(startPt&&mousePos&&lineStarted){
    drawStroke(drCtx,{x1:startPt.x,y1:startPt.y,x2:mousePos.x,y2:mousePos.y,mode,th:strokeThickness},0.45);
  }
}

async function exportPDF(){
  const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight();

  // Couverture — fond noir
  doc.setFillColor(10,10,15); doc.rect(0,0,W,H,'F');

  // Logo centré sur couverture — pleine qualité PNG transparent
  const logoW=90, logoH=30;
  try{
    // Logo fond noir — ratio 2.108 (3162x1500px)
    const LOGO_RATIO=2.108;
    const lh=22, lw=lh*LOGO_RATIO;
    doc.addImage(LOGO_SRC,'JPEG',W/2-lw/2,12,lw,lh);
  }catch(e){}

  doc.setTextColor(74,144,255); doc.setFontSize(56); doc.setFont('helvetica','bold');
  doc.text('CROQUIS',W/2,H/2-6,{align:'center'});
  doc.setTextColor(255,255,255); doc.setFontSize(13); doc.setFont('helvetica','normal');
  doc.text('APPALACHES LUMINA — ECLAIRAGE INTELLIGENT',W/2,H/2+10,{align:'center'});

  // Légende
  doc.setDrawColor(255,48,48); doc.setLineWidth(1.5); doc.setLineDashPattern([2,2],0);
  doc.line(W/2-42,H/2+24,W/2-22,H/2+24); doc.setLineDashPattern([],0);
  doc.setTextColor(200,200,200); doc.setFontSize(10); doc.text('Pixel LED',W/2-20,H/2+25);
  doc.setDrawColor(74,144,255); doc.line(W/2+10,H/2+24,W/2+30,H/2+24);
  doc.text('Strip LED',W/2+32,H/2+25);

  // Pages options
  for(let i=0;i<options.length;i++){
    const opt=options[i];
    doc.addPage();
    doc.setFillColor(10,10,15); doc.rect(0,0,W,H,'F');
    doc.setTextColor(74,144,255); doc.setFontSize(10); doc.setFont('helvetica','bold');
    doc.text('OPTION '+(i+1),10,12);
    doc.setTextColor(255,255,255); doc.setFontSize(14); doc.text(opt.name,10,21);

    if(opt.img&&opt.imgNative){
      // Charge image native pleine résolution
      const natImg=new Image();
      await new Promise(res=>{natImg.onload=res; natImg.src=opt.imgNative;});
      const nW=natImg.naturalWidth, nH=natImg.naturalHeight;
      const offC=document.createElement('canvas');
      offC.width=nW; offC.height=nH;
      const offCtx=offC.getContext('2d');
      offCtx.drawImage(natImg,0,0,nW,nH);
      const scaleX=nW/opt.imgW, scaleY=nH/opt.imgH;
      const sc=Math.max(scaleX,scaleY);
      opt.strokes.forEach(s=>{
        const ox=(s.x1-opt.imgOffX)*scaleX, oy=(s.y1-opt.imgOffY)*scaleY;
        const ox2=(s.x2-opt.imgOffX)*scaleX, oy2=(s.y2-opt.imgOffY)*scaleY;
        const th=(s.th||4)*sc*1.5;
        offCtx.beginPath();
        offCtx.strokeStyle=s.mode==='pixel'?'#ff3030':'#4a90ff';
        offCtx.lineWidth=th; offCtx.lineCap='round';
        offCtx.shadowColor=s.mode==='pixel'?'#ff303099':'#4a90ff99'; offCtx.shadowBlur=14;
        if(s.mode==='pixel') offCtx.setLineDash([Math.round(6*sc),Math.round(5*sc)]);
        else offCtx.setLineDash([]);
        offCtx.moveTo(ox,oy); offCtx.lineTo(ox2,oy2); offCtx.stroke();
        offCtx.setLineDash([]); offCtx.shadowBlur=0;
      });
      const imgData=offC.toDataURL('image/png');
      const maxW=W-20, maxH=H-32;
      const ratio=Math.min(maxW/nW,maxH/nH);
      const pw=nW*ratio, ph=nH*ratio;
      doc.addImage(imgData,'PNG',(W-pw)/2,26+(maxH-ph)/2,pw,ph,undefined,'FAST');
    } else {
      doc.setTextColor(40,60,100); doc.setFontSize(16);
      doc.text('Aucune image',W/2,H/2,{align:'center'});
    }

    // Logo en bas à droite — bonne taille PNG
    try{
    const LOGO_RATIO2=2.108;
    const lh2=11, lw2=lh2*LOGO_RATIO2;
    doc.addImage(LOGO_SRC,'JPEG',W-lw2-6,H-lh2-4,lw2,lh2);
  }catch(e){}
    doc.setTextColor(40,60,100); doc.setFontSize(8); doc.text('appalacheslumina.ca',10,H-5);
  }
  doc.save('lumina-croquis.pdf');
}

setMode('pixel');
renderTabs();

</script>
</body>
</html>
